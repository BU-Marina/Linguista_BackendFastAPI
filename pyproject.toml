[tool.poetry]
name = "backendfastapi"
version = "0.1.0"
description = ""
authors = ["BU-Marina <vorona.2003.bu@yandex.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
django = "5.2.9"
fastapi = "^0.124.0"
uvicorn = "^0.38.0"
sqlalchemy = "^2.0.45"
alembic = "^1.17.2"
pydantic-settings = "^2.12.0"
asyncpg = "^0.31.0"
psycopg2 = "^2.9.11"
fastapi-users = "^15.0.1"
authlib = "^1.6.5"
aioredis = "^2.0.1"
unidecode = "^1.4.0"
python-slugify = "^8.0.4"
passlib = "^1.7.4"
aiofiles = "^25.1.0"
aioboto3 = "^15.5.0"
fastapi-mail = "^1.6.0"
celery = "^5.6.0"
django-celery-beat = "^2.8.1"
dj-database-url = "^3.0.1"
fastapi-users-db-sqlalchemy = "^7.0.0"
redis = "^7.1.0"
httpx = "^0.28.1"
setuptools = "^80.9.0"
websockets = "^16.0"

[tool.poetry.group.dev.dependencies]
gevent = "^25.9.1"
pre-commit = "^4.5.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "LC_MESSAGES",
    ".pytest-cache",
    "*/migrations/*",
    "*/__pycache__/*",
]
# Same as Black.
line-length = 88
indent-width = 4
# Assume Python 3.10
target-version = "py310"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "single"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402", "F841"]
"src/config/asgi.py" = ["E402"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
